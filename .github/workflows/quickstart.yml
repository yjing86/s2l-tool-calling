name: CPU quickstart
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m s2l_tool_calling demo
      - run: python -m s2l_tool_calling score --input examples/calls.jsonl
      - run: python -m s2l_tool_calling results
      - run: python -m unittest discover -s tests
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/selection.txt
      - run: python -m s2l_tool_calling select --input examples/trajectories.jsonl --count 4 --clusters 3
